name: Perseus Mining

description: 'Perseus Mining Limited is an Australian, ASX-listed (ASX: PRU) gold producer, developer and explorer focused
  on Africa. It operates three gold mines - Edikan in Ghana, and Sissingué and Yaouré in Côte d''Ivoire - and is developing
  the Nyanzaga Gold Project in Tanzania. Its website (perseusmining.com) publishes corporate, operations, sustainability and
  investor information (ASX announcements, reports, presentations); no public developer API, API documentation or developer
  portal was found on the site. Surfaced via the API Evangelist harvest backlog (australia-apidays-2026).'

